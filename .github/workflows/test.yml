name: Test and Lint

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Tests
        run: go test -v -race -cover -coverprofile=coverage.out -coverpkg=./... ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error

  # The master ruleset requires a status check named exactly "Test and Lint"
  # (the workflow name). Report it from one job that passes only when both
  # Lint and Test succeeded, so the required context reflects both jobs.
  test-and-lint:
    name: Test and Lint
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Lint and Test to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "Lint: $LINT_RESULT, Test: $TEST_RESULT"
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
